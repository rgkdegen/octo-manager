<!doctype html>
<html><head><meta charset="utf-8">
<title>RGK · Octo Manager</title>
<style>html,body{margin:0;background:#EEEBE4}body{display:flex;justify-content:center}canvas{display:block;width:min(1080px,100vw)!important;height:auto!important;aspect-ratio:1080/1350}</style>
</head><body>
<canvas id="c" width="2160" height="2700" style="width:1080px;height:1350px"></canvas>
<script>
const W=1080,H=1350,FPS=30,DUR=18;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.scale(2,2);

const C={bg:'#EEEBE4',card:'#FFFFFF',ink:'#141414',mut:'#8C887E',line:'#DCD7CC',
  coral:'#FF5A45',coralD:'#D63F2C',coralL:'#FF9A84',suck:'#FFC9BC',done:'#1FA866'};
const SANS='Inter, sans-serif', MONO='"DejaVu Sans Mono", monospace';

// ---------- seeded rng ----------
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}

// ---------- bots ----------
const BOTS=[
 {n:'01',tag:'TRENDS',name:'Scout',desc:'Scans X for new narratives first.',col:'#7B5CFF',viz:'spark'},
 {n:'02',tag:'LAUNCHES',name:'Sniper',desc:'Skips bundles >20% or dev >5%.',col:'#0FA896',viz:'bars'},
 {n:'03',tag:'SECURITY',name:'Rug Guard',desc:'Dev sells once → exits everything.',col:'#F0457E',viz:'list'},
 {n:'04',tag:'EXITS',name:'Treasurer',desc:'Sells 20% at 3x, 8x, 20x. Trails at −35%.',col:'#1FA866',viz:'spark'},
 {n:'05',tag:'VIDEO',name:'Clipper',desc:'Turns raw streams into captioned vertical clips.',col:'#FF7A1A',viz:'wave'},
 {n:'06',tag:'CONTENT',name:'Ghostwriter',desc:'Drafts posts in your voice. You approve.',col:'#2F6BFF',viz:'list'},
 {n:'07',tag:'ENGAGEMENT',name:'Reply Guy',desc:'Replies under big accounts within 90s.',col:'#E59A12',viz:'bars'},
 {n:'08',tag:'REPORTS',name:'Accountant',desc:'Daily PnL and where every gain came from.',col:'#3A3A3A',viz:'bars'},
];
const LOGS=[
 ['narrative spotted · "octo summer" +340% mentions','new cluster · AI agents x memes','trend cooled · dropped 2 watchlist tags','KOL wave · 6 accounts posting $INKY'],
 ['$GLONK skipped · bundle 40%','$BLORP skipped · dev holding 10.9%','$INKY sized 12/16 · in at 7.0','$REEF passed all 6 reads · entry'],
 ['dev wallet quiet · $INKY ok','$TIDE dev moved 2.1% → exit all','LP lock verified · $REEF','fresh wallet cluster flagged · $BLOOP'],
 ['$INKY sold 20% at 3x','$FROGGO out at 41.3x · +282 SOL','$REEF trail raised to −35%','$INKY sold 20% at 8x'],
 ['stream 2h14m → 6 clips · captioned','clip #3 hook rewritten · 0.8s cut','4 verticals exported 1080×1920','b-roll matched · 2 clips queued'],
 ['hook drafted · waiting for approval','thread 7/7 drafted · your voice','post scheduled 18:00 CET','3 hook variants · A/B ready'],
 ['replied under @whale · 41s','12 replies sent · 0 flagged','reply ratio 1:9 · 2.3k views','reply queued · 74s window'],
 ['PnL report built · +$12,480 today','attribution: 71% exits / 29% snipes','weekly sheet updated','fees reconciled · 0.4% drag'],
];

// layout
const CW=320,CHh=186,GX=20,X0=40;
const colX=i=>X0+i*(CW+GX);
const RECTS=[
 {x:colX(0),y:300},{x:colX(1),y:300},{x:colX(2),y:300},
 {x:colX(2),y:540},
 {x:colX(2),y:780},{x:colX(1),y:780},{x:colX(0),y:780},
 {x:colX(0),y:540},
];
const OC={x:540,y:640}; // octopus center
function anchorOf(i){
  const r=RECTS[i];
  if(r.y===300) return {x:r.x+CW/2+(i===0?60:i===2?-60:0),y:r.y+CHh};
  if(r.y===780) return {x:r.x+CW/2+(i===6?60:i===4?-60:0),y:r.y};
  if(r.x<OC.x) return {x:r.x+CW,y:r.y+CHh/2};
  return {x:r.x,y:r.y+CHh/2};
}

// ---------- schedule ----------
const EXT=0.45,RET=0.5;
const SCHED=BOTS.map(()=>[]);
const firsts=[0.25,1.0,1.7,0.6,2.4,1.35,3.0,2.0];
for(let i=0;i<8;i++){
  let t=firsts[i];
  while(t<DUR+2){
    const d=2.0+rnd()*2.2;
    SCHED[i].push({s:t,run:t+EXT,e:t+EXT+d,end:t+EXT+d+RET,log:SCHED[i].length%LOGS[i].length});
    t=t+EXT+d+RET+0.9+rnd()*2.4;
  }
}
const EVENTS=[];
SCHED.forEach((L,i)=>L.forEach(j=>EVENTS.push({t:j.e,i,msg:LOGS[i][j.log]})));
EVENTS.sort((a,b)=>a.t-b.t);

function state(i,t){
  for(const j of SCHED[i]){
    if(t>=j.s && t<j.end){
      let reach, phase, prog=0;
      if(t<j.run){reach=ease((t-j.s)/EXT);phase='grab'}
      else if(t<j.e){reach=1;phase='run';prog=(t-j.run)/(j.e-j.run)}
      else {reach=1-ease((t-j.e)/RET);phase='done';prog=1}
      return {reach,phase,prog,job:j};
    }
  }
  return {reach:0,phase:'idle',prog:0};
}
function doneCount(i,t){return SCHED[i].filter(j=>j.e<=t).length}
function lastDone(i,t){let d=null;for(const j of SCHED[i]) if(j.e<=t) d=j;return d}
const ease=x=>{x=Math.max(0,Math.min(1,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

// ---------- primitives ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function txt(s,x,y,font,col,align='left'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

// ---------- header ----------
function header(t){
  // logo tile
  rr(40,38,96,96,24);ctx.fillStyle=C.ink;ctx.fill();
  miniOcto(88,92,1.0,t);
  txt('RGK · THE DESK THAT RUNS ITSELF',158,62,`600 13px ${MONO}`,C.mut);
  txt('Octo Manager',156,122,`800 58px ${SANS}`,C.ink);
  txt('@rgk_degen',1040,66,`700 22px ${SANS}`,C.ink,'right');
  txt('ONE OCTOPUS · EIGHT ARMS',1040,92,`600 12px ${MONO}`,C.mut,'right');
  txt('ZERO MANUAL CLICKS',1040,112,`600 12px ${MONO}`,C.mut,'right');

  txt('8 ARMS. 8 JOBS.',40,214,`800 40px ${SANS}`,C.ink);
  txt('One octopus hands out every task, watches it run, and closes it.',40,244,`500 17px ${SANS}`,C.mut);
  // live pill
  const active=BOTS.filter((b,i)=>state(i,t).phase!=='idle').length;
  rr(860,186,180,40,20);ctx.fillStyle=C.card;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.stroke();
  const pulse=.5+.5*Math.sin(t*6);
  ctx.beginPath();ctx.arc(884,206,6,0,7);ctx.fillStyle=hexA(C.coral,.25+.5*pulse);ctx.fill();
  ctx.beginPath();ctx.arc(884,206,3.5,0,7);ctx.fillStyle=C.coral;ctx.fill();
  txt(`LIVE · ${active}/8 ARMS`,900,211,`700 14px ${MONO}`,C.ink);
  // segmented rule
  for(let k=0;k<8;k++){const st=state(k,t);
    rr(40+k*126.25,268,118,4,2);ctx.fillStyle=st.phase==='idle'?C.line:BOTS[k].col;ctx.fill();}
}

// ---------- cards ----------
function card(i,t){
  const b=BOTS[i],r=RECTS[i],st=state(i,t);
  const act=st.phase!=='idle';
  const lift=act?ease(Math.min(st.reach*1.4,1))*4:0;
  const x=r.x,y=r.y-lift;
  // shadow
  ctx.save();ctx.shadowColor='rgba(40,30,20,'+(0.06+lift*0.025)+')';ctx.shadowBlur=18+lift*4;ctx.shadowOffsetY=4+lift;
  rr(x,y,CW,CHh,20);ctx.fillStyle=C.card;ctx.fill();ctx.restore();
  rr(x,y,CW,CHh,20);ctx.lineWidth=act?2.5:1.2;ctx.strokeStyle=act?hexA(C.coral,0.35+0.65*st.reach):C.line;ctx.stroke();
  // preview pane
  const px=x+12,py=y+12,pw=112,ph=CHh-24;
  rr(px,py,pw,ph,13);ctx.fillStyle=hexA(b.col,0.09);ctx.fill();
  viz(b,px,py,pw,ph,st,t,i);
  // text
  const tx=x+138;
  txt(b.n,tx,y+32,`700 12px ${MONO}`,C.mut);
  txt(b.tag,tx+26,y+32,`700 12px ${MONO}`,b.col);
  txt(b.name,tx,y+64,`800 25px ${SANS}`,C.ink);
  ctx.font=`500 13.5px ${SANS}`;const ws=b.desc.split(' ');let line='',ln=0;
  for(const w of ws){const tst=line?line+' '+w:w;if(ctx.measureText(tst).width>CW-150&&line){txt(line,tx,y+90+ln*18,`500 13.5px ${SANS}`,'#5E5A52');ln++;line=w}else line=tst}
  txt(line,tx,y+90+ln*18,`500 13.5px ${SANS}`,'#5E5A52');
  // status
  const sy=y+CHh-48;
  ctx.fillStyle=C.line;ctx.fillRect(tx,sy-6,CW-150,1);
  const n=doneCount(i,t)+[14,31,9,22,6,17,48,3][i];
  const ld=lastDone(i,t), flash=ld && t-ld.e<1.1 && st.phase!=='grab' && st.phase!=='run';
  if(st.phase==='grab'||st.phase==='run'){
    const pct=Math.floor(st.prog*100);
    rr(tx,sy+6,108,26,13);ctx.fillStyle=C.coral;ctx.fill();
    txt(st.phase==='grab'?'ASSIGNING':`RUNNING ${String(pct).padStart(2,'0')}%`,tx+54,sy+23,`700 11px ${MONO}`,'#fff','center');
    rr(tx+118,sy+16,CW-150-118,6,3);ctx.fillStyle='#F1EEE8';ctx.fill();
    rr(tx+118,sy+16,Math.max(6,(CW-150-118)*st.prog),6,3);ctx.fillStyle=C.coral;ctx.fill();
  } else if(flash||st.phase==='done'){
    rr(tx,sy+6,86,26,13);ctx.fillStyle=C.done;ctx.fill();
    txt('DONE ✓',tx+43,sy+23,`700 11px ${MONO}`,'#fff','center');
    txt(`×${n} today`,tx+98,sy+24,`600 12px ${MONO}`,C.mut);
  } else {
    rr(tx,sy+6,62,26,13);ctx.fillStyle='#F1EEE8';ctx.fill();
    txt('IDLE',tx+31,sy+23,`700 11px ${MONO}`,C.mut,'center');
    txt(`×${n} today`,tx+74,sy+24,`600 12px ${MONO}`,C.mut);
  }
}

function viz(b,x,y,w,h,st,t,i){
  const p=st.phase==='idle'?(lastDone(i,t)?1:0.15):st.prog;
  const live=st.phase==='run';
  ctx.save();rr(x,y,w,h,13);ctx.clip();
  txt(b.tag,x+10,y+18,`700 8.5px ${MONO}`,hexA(b.col,0.8));
  if(b.viz==='spark'){
    ctx.beginPath();const N=24;
    for(let k=0;k<=N;k++){const u=k/N;if(u>Math.max(p,0.15))break;
      const v=0.25+0.55*u+0.12*Math.sin(u*11+i)+(live?0.03*Math.sin(t*9+k):0);
      const X=x+10+u*(w-20),Y=y+h-22-v*(h-56);k?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}
    ctx.strokeStyle=b.col;ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.stroke();
    ctx.lineTo(x+10+Math.max(p,.15)*(w-20),y+h-14);ctx.lineTo(x+10,y+h-14);ctx.fillStyle=hexA(b.col,.12);ctx.fill();
  } else if(b.viz==='bars'){
    const N=6;for(let k=0;k<N;k++){
      const hh=(0.3+0.6*Math.abs(Math.sin(k*1.7+i)))*(h-50)*clamp(p*N-k+0.6,0.12,1)*(live?(0.93+0.07*Math.sin(t*8+k)):1);
      rr(x+12+k*15.5,y+h-14-hh,10,hh,3);ctx.fillStyle=k===N-1&&live?C.coral:hexA(b.col,0.85);ctx.fill();}
  } else if(b.viz==='list'){
    for(let k=0;k<4;k++){const yy=y+36+k*26;const ok=p*4>k+0.6;
      rr(x+10,yy-9,13,13,4);ctx.fillStyle=ok?b.col:'#fff';ctx.fill();ctx.strokeStyle=hexA(b.col,.5);ctx.lineWidth=1.2;ctx.stroke();
      if(ok){ctx.beginPath();ctx.moveTo(x+13,yy-3);ctx.lineTo(x+16,yy);ctx.lineTo(x+21,yy-6);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
      rr(x+29,yy-6,(w-44)*(0.55+0.4*((k*37)%10)/10),7,3.5);ctx.fillStyle=hexA(C.ink,ok?0.55:0.15);ctx.fill();}
  } else if(b.viz==='wave'){
    const N=16;for(let k=0;k<N;k++){
      const a=(0.2+0.8*Math.abs(Math.sin(k*0.9+(live?t*7:0))*Math.cos(k*0.37)))*(h-60);
      const X=x+10+k*((w-20)/N);const on=k/N<p;
      rr(X,y+h/2+8-a/2,4,a,2);ctx.fillStyle=on?b.col:hexA(b.col,.25);ctx.fill();}
    rr(x+10+p*(w-24),y+28,2,h-42,1);ctx.fillStyle=C.coral;ctx.fill();
  }
  ctx.restore();
}

// ---------- octopus ----------
function bez(p0,p1,p2,p3,u){const v=1-u;return{x:v*v*v*p0.x+3*v*v*u*p1.x+3*v*u*u*p2.x+u*u*u*p3.x,y:v*v*v*p0.y+3*v*v*u*p1.y+3*v*u*u*p2.y+u*u*u*p3.y}}

function armPoints(i,t,st){
  const a=anchorOf(i);
  const ang=Math.atan2(a.y-OC.y,a.x-OC.x);
  const root={x:OC.x+Math.cos(ang)*48,y:OC.y+28+Math.sin(ang)*38};
  // idle tip: hangs toward card but short and droopy
  const idleLen=95+10*Math.sin(t*1.3+i);
  const idleTip={x:root.x+Math.cos(ang)*idleLen,y:root.y+Math.sin(ang)*idleLen*0.75+38+8*Math.sin(t*1.7+i*2)};
  const r=st.reach;
  const tip={x:idleTip.x+(a.x-idleTip.x)*r,y:idleTip.y+(a.y-idleTip.y)*r};
  const dx=tip.x-root.x,dy=tip.y-root.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  const sw=(i%2?1:-1)*(28+12*Math.sin(t*1.9+i))*(1-0.4*r);
  const c1={x:root.x+dx*0.33+nx*sw,y:root.y+dy*0.33+ny*sw+(1-r)*25};
  const c2={x:root.x+dx*0.7-nx*sw*0.8,y:root.y+dy*0.7-ny*sw*0.8};
  const pts=[];const N=46;
  for(let k=0;k<=N;k++){const u=k/N;const p=bez(root,c1,c2,tip,u);
    const wob=Math.sin(u*9-t*4.5+i)*6*u*(1-0.7*r);
    pts.push({x:p.x+nx*wob,y:p.y+ny*wob})}
  return pts;
}

function drawArm(i,t){
  const st=state(i,t);const pts=armPoints(i,t,st);
  const N=pts.length-1;
  // tapered body
  for(let pass=0;pass<2;pass++){
    for(let k=0;k<N;k++){const u=k/N;const w=(26-18*u)+(pass?0:3);
      ctx.beginPath();ctx.moveTo(pts[k].x,pts[k].y);ctx.lineTo(pts[k+1].x,pts[k+1].y);
      ctx.lineWidth=w;ctx.lineCap='round';ctx.strokeStyle=pass?C.coral:C.coralD;ctx.stroke();}
  }
  // highlight
  ctx.beginPath();for(let k=0;k<N*0.85;k++){const p=pts[k];k?ctx.lineTo(p.x,p.y-4+2*k/N):ctx.moveTo(p.x,p.y-4)}
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=4;ctx.stroke();
  // suckers
  for(let k=6;k<N-2;k+=4){const p=pts[k],q=pts[k+1];const dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1;
    const off=(10-6*k/N);const sx=p.x+(-dy/L)*off*(i%2?1:-1),sy=p.y+(dx/L)*off*(i%2?1:-1);
    ctx.beginPath();ctx.arc(sx,sy,3.6-2*k/N,0,7);ctx.fillStyle=C.suck;ctx.fill();}
  // grip at card
  if(st.reach>0.95){const tp=pts[N];ctx.beginPath();ctx.arc(tp.x,tp.y,7,0,7);ctx.fillStyle=C.coral;ctx.fill();
    ctx.beginPath();ctx.arc(tp.x,tp.y,13+4*Math.sin(t*8),0,7);ctx.strokeStyle=hexA(C.coral,.35);ctx.lineWidth=2;ctx.stroke();}
  // data pulses
  if(st.phase==='run'){
    for(let m=0;m<3;m++){const u=((t*1.3+m/3)%1);const k=Math.floor(u*N);const p=pts[k];
      ctx.beginPath();ctx.arc(p.x,p.y,4.5,0,7);ctx.fillStyle='#fff';ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill();}
  }
  return st;
}

function lookTarget(t){
  let best=null,bt=-1;
  for(let i=0;i<8;i++){const st=state(i,t);if(st.phase!=='idle'&&st.job.s>bt){bt=st.job.s;best=anchorOf(i)}}
  return best||{x:OC.x+60*Math.sin(t*.8),y:OC.y+40};
}

function body(t){
  const bob=Math.sin(t*2.2)*5;
  const cx=OC.x,cy=OC.y-36+bob;
  // shadow glow
  const g=ctx.createRadialGradient(cx,cy+40,10,cx,cy+40,170);g.addColorStop(0,'rgba(255,90,69,0.16)');g.addColorStop(1,'rgba(255,90,69,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-180,cy-140,360,360);
  // mantle
  const sq=1+0.03*Math.sin(t*2.2+1);
  ctx.save();ctx.translate(cx,cy);ctx.scale(1/sq,sq);
  ctx.beginPath();ctx.moveTo(-86,40);
  ctx.bezierCurveTo(-104,-30,-70,-112,0,-114);
  ctx.bezierCurveTo(70,-112,104,-30,86,40);
  ctx.bezierCurveTo(70,78,-70,78,-86,40);ctx.closePath();
  const mg=ctx.createLinearGradient(0,-114,0,70);mg.addColorStop(0,'#FF7A63');mg.addColorStop(1,C.coralD);
  ctx.fillStyle=mg;ctx.fill();
  // spots
  ctx.fillStyle='rgba(255,255,255,0.13)';
  [[-40,-70,9],[-18,-88,6],[30,-80,11],[52,-52,6],[-58,-36,6]].forEach(s=>{ctx.beginPath();ctx.arc(s[0],s[1],s[2],0,7);ctx.fill()});
  // shine
  ctx.beginPath();ctx.ellipse(-36,-74,22,12,-0.6,0,7);ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fill();
  // headset band
  ctx.beginPath();ctx.arc(0,-6,92,Math.PI*1.08,Math.PI*1.92);ctx.strokeStyle=C.ink;ctx.lineWidth=7;ctx.stroke();
  rr(-104,-24,22,40,9);ctx.fillStyle=C.ink;ctx.fill();
  ctx.beginPath();ctx.moveTo(-93,12);ctx.quadraticCurveTo(-90,52,-44,52);ctx.strokeStyle=C.ink;ctx.lineWidth=4;ctx.stroke();
  ctx.beginPath();ctx.arc(-42,52,6,0,7);ctx.fillStyle=C.ink;ctx.fill();
  // badge
  rr(-26,-104,52,22,11);ctx.fillStyle=C.ink;ctx.fill();
  txt('RGK',0,-88,`800 13px ${SANS}`,'#fff','center');
  // eyes
  const lt=lookTarget(t);const ex=clamp((lt.x-cx)/260,-1,1),ey=clamp((lt.y-cy)/260,-1,1);
  const bl=(t%3.7)<0.13?0.12:1;
  for(const s of[-1,1]){const exx=s*34,eyy=-18;
    ctx.beginPath();ctx.ellipse(exx,eyy,23,25*bl,0,0,7);ctx.fillStyle='#fff';ctx.fill();
    if(bl>0.5){ctx.beginPath();ctx.arc(exx+ex*9,eyy+ey*9,12,0,7);ctx.fillStyle=C.ink;ctx.fill();
      ctx.beginPath();ctx.arc(exx+ex*9-4,eyy+ey*9-5,4,0,7);ctx.fillStyle='#fff';ctx.fill();}}
  // cheeks + smile
  ctx.fillStyle='rgba(255,180,170,0.55)';
  ctx.beginPath();ctx.ellipse(-58,18,12,7,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(58,18,12,7,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,14,10,0.15*Math.PI,0.85*Math.PI);ctx.strokeStyle=C.ink;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.stroke();
  ctx.restore();
}

function miniOcto(cx,cy,s,t){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  for(let k=0;k<5;k++){const xx=-20+k*10;ctx.beginPath();ctx.moveTo(xx,-4);
    ctx.quadraticCurveTo(xx+6*Math.sin(t*3+k),14,xx+(k-2)*4,22);ctx.strokeStyle=C.coral;ctx.lineWidth=6;ctx.lineCap='round';ctx.stroke()}
  ctx.beginPath();ctx.ellipse(0,-18,26,24,0,0,7);ctx.fillStyle=C.coral;ctx.fill();
  for(const s2 of[-1,1]){ctx.beginPath();ctx.arc(s2*9,-18,6,0,7);ctx.fillStyle='#fff';ctx.fill();
    ctx.beginPath();ctx.arc(s2*9+1,-17,3,0,7);ctx.fillStyle=C.ink;ctx.fill()}
  ctx.restore();
}

// ---------- bottom ----------
function stats(t){
  const done=BOTS.reduce((a,b,i)=>a+doneCount(i,t),0);
  const tiles=[
    ['TASKS CLOSED',(1284+done).toLocaleString('en-US'),C.ink],
    ['ARMS ON DUTY',BOTS.filter((b,i)=>state(i,t).phase!=='idle').length+' / 8',C.coral],
    ['HOURS SAVED',(37.4+done*0.6).toFixed(1)+'h',C.ink],
    ['MANUAL CLICKS','0',C.done],
  ];
  const tw=(W-80-3*16)/4;
  tiles.forEach((tl,k)=>{const x=40+k*(tw+16),y=1000;
    rr(x,y,tw,92,18);ctx.fillStyle=C.card;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.2;ctx.stroke();
    txt(tl[0],x+18,y+30,`700 11px ${MONO}`,C.mut);
    txt(tl[1],x+18,y+72,`800 34px ${SANS}`,tl[2]);});
}

function logPanel(t){
  const x=40,y=1110,w=W-80,h=196;
  rr(x,y,w,h,20);ctx.fillStyle='#16130F';ctx.fill();
  txt('OCTO.LOG',x+22,y+32,`700 13px ${MONO}`,'#FF8B76');
  txt('sim run · numbers illustrative',x+w-22,y+32,`500 12px ${MONO}`,'#7D766A','right');
  ctx.fillStyle='#2A251E';ctx.fillRect(x+22,y+46,w-44,1);
  const shown=EVENTS.filter(e=>e.t<=t).slice(-5);
  const base=[ // pre-filled history so it is never empty
    {i:7,msg:'morning report sent · 08:00',t:-9},{i:0,msg:'watchlist refreshed · 42 tags',t:-8},
    {i:5,msg:'2 drafts approved overnight',t:-7},{i:1,msg:'$KRILL skipped · dev holding 7.2%',t:-6},{i:3,msg:'$SQUID out at 12.4x · +96 SOL',t:-5}];
  const rows=base.concat(shown).slice(-5);
  ctx.save();rr(x,y+50,w,h-56,0);ctx.clip();
  const last=shown.length?shown[shown.length-1].t:-99;const sl=clamp((t-last)/0.25,0,1);
  rows.forEach((e,k)=>{
    const yy=y+80+k*26+(1-ease(sl))*26*(shown.length?1:0)*(k===rows.length-1?0:0);
    const fresh=k===rows.length-1&&t-e.t<0.9&&e.t>0;
    const a=fresh?ease(sl):1;
    const sec=Math.max(0,Math.floor(e.t+3));
    const clock=`11:47:${String(10+sec).padStart(2,'0')}`;
    ctx.globalAlpha=a;
    txt(e.t<0?'11:46:5'+(9+e.t+5):clock,x+22,yy,`500 13px ${MONO}`,'#6E675B');
    txt(`arm.${BOTS[e.i].n}`,x+118,yy,`700 13px ${MONO}`,'#FF8B76');
    txt(BOTS[e.i].name.toUpperCase().padEnd(12,' '),x+190,yy,`700 13px ${MONO}`,'#EDE6D8');
    txt(e.msg,x+310,yy,`500 13px ${MONO}`,fresh?'#B8F36B':'#BDB4A4');
    txt('✓',x+w-30,yy,`700 13px ${MONO}`,'#4CD38A');
    ctx.globalAlpha=1;
  });
  ctx.restore();
}

function footer(t){
  txt('built with Claude · one octopus, eight arms',40,1334,`500 11px ${MONO}`,C.mut);
  txt('rgk_degen',1040,1334,`700 11px ${MONO}`,C.mut,'right');
}

// ---------- frame ----------
function render(t){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  // dotted grid
  ctx.fillStyle='rgba(0,0,0,0.05)';
  for(let gx=20;gx<W;gx+=30)for(let gy=290;gy<990;gy+=30){ctx.fillRect(gx,gy,1.5,1.5)}
  header(t);
  const order=[...Array(8).keys()].sort((a,b)=>state(a,t).reach-state(b,t).reach);
  order.filter(i=>state(i,t).reach<0.5).forEach(i=>drawArm(i,t));
  for(let i=0;i<8;i++)card(i,t);
  order.filter(i=>state(i,t).reach>=0.5).forEach(i=>drawArm(i,t));
  body(t);
  stats(t);logPanel(t);footer(t);
}
window.render=render;window.DUR=DUR;window.FPS=FPS;
document.fonts.load(`800 40px Inter`).then(()=>document.fonts.load(`700 13px "DejaVu Sans Mono"`)).then(()=>{
  render(0);window.ready=true;
  // live mode: play in real time unless opened by the exporter (?render)
  if(!location.search.includes('render')){
    const t0=performance.now();
    const loop=now=>{render(((now-t0)/1000)%DUR);requestAnimationFrame(loop)};
    requestAnimationFrame(loop);
  }
});
</script></body></html>
